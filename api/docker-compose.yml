name: cleanslice

services:
  postgres-local:
    image: postgres:18
    ports:
      - '4230:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: cleanslice-api-local-database
    volumes:
    # for postgres:18, the volume must be a directory, not a file
      - ./docker/postgresql:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Mailpit: catches every email the API sends. Inbox at http://localhost:4232
  mail-local:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:4231:1025' # SMTP (SMTP_HOST/SMTP_PORT in .env)
      - '127.0.0.1:4232:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: '500'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30
